# Publica el juego en GitHub Pages (https://usources.github.io/ilogic-remake/) con cada push a main.
# Se publica en la raiz de la rama gh-pages; las previews de las PR viven en gh-pages/preview/
# (preview.yml) y esta publicacion no las toca.
# Requiere Settings → Pages → Source: "Deploy from a branch", rama gh-pages, carpeta / (root).
name: Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Una publicacion de la web a la vez. Cola propia, no la de las previews: en una cola compartida,
# GitHub descarta la publicacion que espera si llega otra detras. Si dos suben a gh-pages a la vez,
# la accion reintenta el push (attempt-limit).
concurrency:
  group: gh-pages-web
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/art/requirements.txt
      - run: python -m pip install -r tools/art/requirements.txt
      - run: npm ci
      # Tipos, lint, formato y tests (npm run check); el build no sigue si algo falla.
      - run: npm run check
      # build compila tambien los graficos (prebuild → npm run assets).
      - run: npm run build
      - run: touch dist/.nojekyll
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          attempt-limit: 5
          folder: dist
          # Borra lo viejo de la raiz, pero nunca las previews ni el aviso de Jekyll.
          clean-exclude: |
            preview/
            .nojekyll
          commit-message: '🚀 Web desde ${{ github.sha }}'
