# Publica el juego en GitHub Pages (https://usources.github.io/ilogic-remake/) con cada push a main.
# Requiere Settings → Pages → Source: GitHub Actions.
name: Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Una publicacion a la vez; si llega otra, la que estaba esperando se descarta.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/art/requirements.txt
      - run: python -m pip install -r tools/art/requirements.txt
      - run: npm ci
      # Tipos, lint, formato y tests (npm run check); el build no sigue si algo falla.
      - run: npm run check
      # build compila tambien los graficos (prebuild → npm run assets).
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
