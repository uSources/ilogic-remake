# Busca claves, tokens y contraseñas en los commits de cada PR con gitleaks: reglas fijas, sin IA,
# asi que no se le pasa uno por un mal dia. Se suma a lo que ya hay: el secret scanning de GitHub
# (con push protection, solo conoce los tokens de proveedores) y la revision de Claude
# (claude-review.yml), que mira lo que una regla no ve.
# El repo es publico: la salida va con --redact para que el log no enseñe lo que encuentra.
# Un falso positivo se marca en su linea con el comentario `gitleaks:allow` (README, "Claude en GitHub").
name: Secretos

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: secretos-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    env:
      VERSION: 8.30.1
      # De gitleaks_8.30.1_checksums.txt de su Release: si el fichero no es ese, no se ejecuta.
      SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Instalar gitleaks
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      # Solo los commits de la PR (los mismos que mira commitlint): lo de main ya se miro en su PR.
      - name: Buscar secretos en los commits de la PR
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: '"$RUNNER_TEMP/gitleaks" git --log-opts="$BASE..$HEAD" --redact --verbose --no-banner'
