# Capturas de referencia (npm run shots) en las PR que pueden cambiar lo que se ve. Informativo: la
# GPU y las fuentes del servidor pueden diferir un poco de las de quien hizo las referencias, asi que
# no bloquea. El informe (capturas, referencias y diferencias) queda en los artefactos del run:
# "capturas". No corre en main (ya se paso en la PR) ni en PR de documentacion, CI o herramientas.
name: Capturas

on:
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'CHANGELOG.md' # la pantalla de Novedades
      - 'tests/visual/**'
      - 'scripts/build-single.mjs'
      - 'vite.config.ts'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

# Un push nuevo a la PR cancela las capturas del anterior.
concurrency:
  group: capturas-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  shots:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # El navegador se guarda en cache por version de Playwright; solo faltan las librerias del sistema.
      - id: pw
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps --only-shell chromium
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      # Graficos ya compilados en el repo: sin Python ni npm run assets.
      - run: npm run build:ci && node tests/visual/shots.mjs
      # Gestos con el dedo en una pantalla de movil (mover con dos toques, atacar, comprar, arrastrar).
      - run: node tests/visual/touch.mjs
      # Teclado de verdad: Tab en el mapa, la pantalla final y los cuadros de texto.
      - run: node tests/visual/keys.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas
          path: tests/visual/out/
