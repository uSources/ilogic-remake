# Revision automatica de cada PR por Claude con las normas del proyecto (skills ilogic-code y phaser4).
# Necesita el mismo secreto que claude.yml; sin el, no hace nada.
name: Revision de Claude

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: ¿Hay credenciales de Claude?
        id: auth
        env:
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$OAUTH$KEY" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::Revision de Claude desactivada: falta el secreto (ver .github/workflows/claude.yml)"; fi
      - uses: actions/checkout@v5
        if: steps.auth.outputs.ok
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        if: steps.auth.outputs.ok
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR: ${{ github.event.pull_request.number }}

            Revisa este PR del juego Ilogic en español. Antes, lee CLAUDE.md, docs/ARQUITECTURA.md y
            .claude/skills/ilogic-code/SKILL.md (y .claude/skills/phaser4/SKILL.md si toca escenas o dibujo).

            Comprueba sobre todo:
            1. Capas: src/core sin Phaser/DOM/interfaz; logica nueva en core con test.
            2. Reglas o IA cambiadas: ¿se ha actualizado tests/aiGolden.test.ts a proposito y se explica por que?
            3. Escenas de Phaser: estado reiniciado en resetMatch(), limpieza en SHUTDOWN, nada creado por fotograma.
            4. Numeros en data.ts, textos en settings.ts (es y en), colores en palette.ts; nada duplicado.
            5. Ficheros generados editados a mano (atlas, assetList, *Sets.ts, sheets.ts): deben salir de npm run assets.
            6. Claves, tokens o secretos en el codigo: bloqueante.
            7. Si cambia algo que ve el jugador: CHANGELOG.md y capturas (npm run shots:update) a juego.

            Comentarios en linea para problemas concretos; un resumen corto al final. Sin elogios de relleno.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
