# Publica una Release al subir una etiqueta vX.Y.Z (npm run release): notas de CHANGELOG.md
# y el juego en un solo fichero (ilogic.html) adjunto. El juego las lee en "Novedades".
# Tambien se puede lanzar a mano (Actions → Release → Run workflow) para rehacer una Release.
name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Etiqueta (vX.Y.Z) que ya exista'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/art/requirements.txt
      - run: python -m pip install -r tools/art/requirements.txt
      - run: npm ci
      - name: La version de package.json coincide con la etiqueta
        run: test "v$(node -p "require('./package.json').version")" = "$TAG"
      - run: npm test
      - run: npm run build:single
      - name: Notas del CHANGELOG
        run: |
          node scripts/release-notes.mjs "$TAG" > notes.md
          echo "TITLE=$(node scripts/release-notes.mjs "$TAG" --title)" >> "$GITHUB_ENV"
      - name: Publicar (o actualizar) la Release
        run: |
          cp dist-single/ilogic.html ilogic.html
          PRE=""; case "$TAG" in *-*) PRE="--prerelease";; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes-file notes.md $PRE
            gh release upload "$TAG" ilogic.html --clobber
          else
            gh release create "$TAG" ilogic.html --title "$TITLE" --notes-file notes.md --verify-tag $PRE
          fi
