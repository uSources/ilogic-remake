# Publica la Release de la version de package.json al llegar a main (o a mano: Actions → Release →
# Run workflow): notas de CHANGELOG.md y el juego en un solo fichero (ilogic.html) adjunto.
# Si la Release de esa version ya existe, solo se ponen al dia sus notas (lo que diga el CHANGELOG).
# El juego las lee en "Novedades".
name: Release

on:
  push:
    branches: [main]
    paths: [package.json, CHANGELOG.md]
  workflow_dispatch:

permissions:
  contents: write

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Version
        run: |
          echo "TAG=v$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
          node scripts/release-notes.mjs > notes.md
          echo "TITLE=$(node scripts/release-notes.mjs --title)" >> "$GITHUB_ENV"
      - name: ¿Ya publicada?
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then echo "EXISTS=1" >> "$GITHUB_ENV"; fi
      - name: Poner al dia las notas
        if: env.EXISTS == '1'
        run: gh release edit "$TAG" --title "$TITLE" --notes-file notes.md
      - uses: actions/setup-node@v4
        if: env.EXISTS != '1'
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        if: env.EXISTS != '1'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/art/requirements.txt
      - name: Compilar y probar
        if: env.EXISTS != '1'
        run: |
          python -m pip install -r tools/art/requirements.txt
          npm ci
          npm test
          npm run build:single
      - name: Publicar la Release
        if: env.EXISTS != '1'
        run: |
          cp dist-single/ilogic.html ilogic.html
          PRE=""; case "$TAG" in *-*) PRE="--prerelease";; esac
          gh release create "$TAG" ilogic.html --target "$GITHUB_SHA" --title "$TITLE" --notes-file notes.md $PRE
