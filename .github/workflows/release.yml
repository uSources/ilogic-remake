# Publica la Release de la version de package.json al llegar a main (o a mano: Actions → Release →
# Run workflow): notas de CHANGELOG.md y el juego en un solo fichero (ilogic.html) adjunto.
# Si la Release de esa version ya existe, solo se ponen al dia sus notas (lo que diga el CHANGELOG).
# El juego las lee en "Novedades".
name: Release

on:
  push:
    branches: [main]
    paths: [package.json, CHANGELOG.md]
  workflow_dispatch:

permissions:
  contents: write

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - name: Version
        run: |
          echo "TAG=v$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
          node scripts/release-notes.mjs > notes.md
          echo "TITLE=$(node scripts/release-notes.mjs --title)" >> "$GITHUB_ENV"
      - name: ¿Ya publicada?
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then echo "EXISTS=1" >> "$GITHUB_ENV"; fi
      - name: Poner al dia las notas
        if: env.EXISTS == '1'
        run: gh release edit "$TAG" --title "$TITLE" --notes-file notes.md
      - uses: actions/setup-node@v5
        if: env.EXISTS != '1'
        with:
          node-version: 22
          cache: npm
      # Cada paso deja el final de su salida como aviso si falla (se ve en la pagina del run).
      - name: Instalar
        if: env.EXISTS != '1'
        run: |
          set -o pipefail
          npm ci 2>&1 | tee out.log || { echo "::error title=Instalar::$(tail -c 3000 out.log | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')"; exit 1; }
      # Sin tests: main solo cambia por PR y la PR ya los ha pasado (workflow Tests). Graficos ya
      # compilados en el repo: sin Python ni npm run assets.
      - name: Compilar
        if: env.EXISTS != '1'
        run: |
          set -o pipefail
          npm run build:ci 2>&1 | tee out.log || { echo "::error title=Compilar::$(tail -c 3000 out.log | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')"; exit 1; }
      - name: Publicar la Release
        if: env.EXISTS != '1'
        run: |
          cp dist-single/ilogic.html ilogic.html
          PRE=""; case "$TAG" in *-*) PRE="--prerelease";; esac
          gh release create "$TAG" ilogic.html --target "$GITHUB_SHA" --title "$TITLE" --notes-file notes.md $PRE
