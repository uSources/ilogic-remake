# Preview de cada PR en GitHub Pages: https://usources.github.io/ilogic-remake/preview/<hash>/
# El hash sale de un secreto + el numero de la PR, asi la URL no se adivina probando pr-1, pr-2...
# (es la misma en todos los pushes de la PR). Se borra al cerrar la PR.
# Ojo: el repo es publico y la rama gh-pages tambien, asi que quien mire esa rama ve las carpetas.
# El hash evita que se encuentre por casualidad, no es un control de acceso.
# Secreto opcional PREVIEW_SALT (Settings → Secrets and variables → Actions); sin el, el hash sale
# solo del nombre del repo y el numero de la PR (se puede calcular leyendo este fichero).
name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: write
  pull-requests: write

# Una publicacion a la vez en gh-pages (la comparte con pages.yml).
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  preview:
    # Las PR desde forks no tienen permiso para escribir en gh-pages.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      SALT: ${{ secrets.PREVIEW_SALT }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - id: hash
        run: |
          h=$(printf '%s|%s|%s' "$SALT" "$GITHUB_REPOSITORY" "$PR" | sha256sum | cut -c1-16)
          echo "dir=preview/$h" >> "$GITHUB_OUTPUT"
          echo "url=https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/preview/$h/" >> "$GITHUB_OUTPUT"

      - if: github.event.action != 'closed'
        uses: actions/checkout@v5
      - if: github.event.action != 'closed'
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - if: github.event.action != 'closed'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/art/requirements.txt
      - if: github.event.action != 'closed'
        run: python -m pip install -r tools/art/requirements.txt
      - if: github.event.action != 'closed'
        run: npm ci
      # Sin npm run check: eso ya lo hace la revision de la PR; la preview tiene que salir aunque falle un test.
      - if: github.event.action != 'closed'
        run: npm run build
      - if: github.event.action != 'closed'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
          target-folder: ${{ steps.hash.outputs.dir }}
          commit-message: '🚀 Preview de la PR #${{ github.event.pull_request.number }}'

      # Al cerrar la PR: quitar su carpeta.
      - if: github.event.action == 'closed'
        uses: actions/checkout@v5
        with:
          ref: gh-pages
      - if: github.event.action == 'closed'
        env:
          DIR: ${{ steps.hash.outputs.dir }}
        run: |
          [ -d "$DIR" ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -rq "$DIR"
          git commit -m "🔥 Quitar la preview de la PR #$PR"
          git push

      # Un solo comentario en la PR con el enlace, que se actualiza en cada push.
      - uses: actions/github-script@v7
        env:
          URL: ${{ steps.hash.outputs.url }}
          CLOSED: ${{ github.event.action == 'closed' }}
        with:
          script: |
            const mark = '<!-- ilogic-preview -->';
            const body = process.env.CLOSED === 'true'
              ? `${mark}\nPreview borrada al cerrar la PR.`
              : `${mark}\n🎮 **Preview:** ${process.env.URL}\n\nCommit ${context.payload.pull_request.head.sha.slice(0, 7)}. Puede tardar un minuto en verse tras publicarse.`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const old = comments.find((c) => c.body?.startsWith(mark));
            if (old) await github.rest.issues.updateComment({ owner, repo, comment_id: old.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
